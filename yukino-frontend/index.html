<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yukino</title>

    <!-- Material Symbols — Google Material Icons 字体 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <!-- 启动屏：inline CSS 变量，响应系统 light/dark -->
    <style>
      :root {
        --boot-bg: #fef7ff;
        --boot-text: #49454f;
        --boot-primary: #6750a4;
        --boot-surface: rgba(255, 255, 255, 0.6);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #141218;
          --boot-text: #cac4d0;
          --boot-primary: #d0bcff;
          --boot-surface: rgba(20, 18, 24, 0.65);
        }
      }

      /*
       * MD3 启动屏布局：全屏 flex 居中
       * 背景色由主题引擎注入 CSS 变量，启动时用 fallback
       */
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        transition: opacity 0.42s cubic-bezier(0.05, 0.7, 0.1, 1);
      }
      #boot-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px;
        border-radius: 24px;
        background: var(--boot-surface);
      }

      /*
       * MD3 CircularProgressIndicator
       * 复刻 Android Indeterminate 旋转动画
       * 使用 MD3 标准缓动曲线 cubic-bezier(0.2, 0, 0, 1)
       */
      .boot-ring {
        position: relative;
        width: 48px;
        height: 48px;
      }

      .boot-ring .track {
        fill: none;
        stroke: var(--md-sys-color-surface-container-highest, #e6e0e9);
        stroke-width: 4;
      }

      .boot-ring .arc {
        fill: none;
        stroke: var(--boot-primary);
        stroke-width: 4;
        stroke-linecap: round;
        transform-origin: 50% 50%;
        animation:
          md3-spin 1.4s linear infinite,
          md3-arc-sweep 1.4s cubic-bezier(0.2, 0, 0, 1) infinite;
      }

      @keyframes md3-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes md3-arc-sweep {
        0%   { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
        50%  { stroke-dasharray: 90, 200; stroke-dashoffset: -35; }
        100% { stroke-dasharray: 90, 200; stroke-dashoffset: -125; }
      }

      .boot-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--boot-text);
        letter-spacing: 0.02em;
      }

      .boot-subtitle {
        font-size: 0.8125rem;
        color: var(--boot-text);
        opacity: 0.7;
      }

      /* 线性进度条 */
      .boot-track {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: var(--md-sys-color-surface-container-highest, #e6e0e9);
        overflow: hidden;
      }
      .boot-bar {
        display: block;
        width: 30%;
        height: 100%;
        border-radius: 2px;
        background: var(--boot-primary);
        animation: md3-linear 1.8s cubic-bezier(0.2, 0, 0, 1) infinite;
        transform-origin: 0% 50%;
      }

      @keyframes md3-linear {
        0%   { transform: translateX(-100%) scaleX(0.5); }
        25%  { transform: translateX(-30%) scaleX(1); }
        50%  { transform: translateX(60%) scaleX(1.2); }
        75%  { transform: translateX(150%) scaleX(0.8); }
        100% { transform: translateX(300%) scaleX(0.3); }
      }
    </style>
  </head>
  <body>
    <div id="boot-loading" role="progressbar" aria-label="加载中">
      <div class="boot-card">
        <!-- MD3 CircularProgressIndicator SVG -->
        <div class="boot-ring">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle class="track" cx="24" cy="24" r="20" />
            <circle class="arc" cx="24" cy="24" r="20" />
          </svg>
        </div>
        <div class="boot-title">Yukino</div>
        <div class="boot-subtitle">正在加载控制台资源…</div>
        <div class="boot-track"><span class="boot-bar"></span></div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
